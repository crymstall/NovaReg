<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA | A Cosmic Experience</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <canvas id="webgl-canvas"></canvas>
    <div class="flash-overlay"></div>

    <div id="landing-container" class="active">
        <div class="supernova-glow-trigger" id="enter-btn">
            <div class="nebula-bg-glow"></div>
            <div class="nebula-stars">
                <span class="nebula-star s1"></span>
                <span class="nebula-star s2"></span>
                <span class="nebula-star s3"></span>
            </div>
            <div class="nebula-ring-glow"></div>
            <div class="logo-wrapper">
                <h1 class="landing-title">N O V <span class="lambda-symbol">Λ</span></h1>
                <div class="logo-subheading">B A N K &nbsp;&nbsp; A C C O U N T S</div>
                <div class="logo-country">U S A</div>
            </div>
            <div class="enter-subtitle">CLICK HERE TO PROCEED AND PURCHASE SELF REG AND VERIFIED ACCOUNTS</div>
        </div>
    </div>

    <div id="main-container" class="hidden">
        <header class="navbar">
            <div class="logo">NOVA</div>
            <nav class="nav-links">
                <button class="nav-btn" data-page="mercury">MERCURY</button>
                <button class="nav-btn" data-page="venus">VENUS</button>
                <button class="nav-btn active" data-page="earth">EARTH</button>
                <button class="nav-btn" data-page="mars">MARS</button>
                <button class="nav-btn" data-page="jupiter">JUPITER</button>
            </nav>
        </header>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="space.js"></script>
    <script src="app.js"></script>
</body>
</html>
